<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>✨ To-Do Liste by Pfarospa</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        .page-content {
            max-width: 600px;
            margin: 60px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            color: #333;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 10px 15px;
            background: #f1f1f1;
            border-radius: 8px;
            transition: 0.2s ease;
        }
        .todo-item:hover {
            background: #e0e0e0;
        }
        .todo-text {
            flex-grow: 1;
            margin-left: 12px;
        }
        .completed {
            text-decoration: line-through;
            color: #888;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #e53935;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
    <header class="mdl-layout__header">
        <div class="mdl-layout__header-row">
            <span class="mdl-layout-title">🌟 To-Do Liste 2.0</span>
        </div>
    </header>
    <main class="mdl-layout__content">
        <div class="page-content">
            <h4 style="text-align:center;">Produktiv bleiben mit Stil! ✅</h4>
            <form onsubmit="addTodo(); return false;">
                <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label" style="width:100%;">
                    <input class="mdl-textfield__input" type="text" id="todofield">
                    <label class="mdl-textfield__label" for="todofield">Neues To-Do...</label>
                </div>
                <button type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-js-ripple-effect" style="width:100%;">
                    Hinzufügen
                </button>
            </form>
            <hr>
            <div id="todolist"></div>
        </div>
    </main>
</div>

<script>
    function addTodo() {
        const input = document.getElementById("todofield");
        const text = input.value.trim();
        if (!text) return;

        const list = document.getElementById("todolist");
        const item = document.createElement("div");
        item.className = "todo-item";
        item.innerHTML = `
            <label class="mdl-checkbox mdl-js-checkbox mdl-js-ripple-effect">
                <input type="checkbox" class="mdl-checkbox__input" onchange="toggleComplete(this)">
            </label>
            <span class="todo-text">${text}</span>
            <button class="delete-btn" onclick="deleteTodo(this)"><i class="material-icons">delete</i></button>
        `;
        list.appendChild(item);
        componentHandler.upgradeDom();
        input.value = "";
    }

    function toggleComplete(checkbox) {
        const text = checkbox.closest(".todo-item").querySelector(".todo-text");
        if (checkbox.checked) {
            text.classList.add("completed");
        } else {
            text.classList.remove("completed");
        }
    }

    function deleteTodo(button) {
        const item = button.closest(".todo-item");
        item.remove();
    }
</script>
</body>
</html>
